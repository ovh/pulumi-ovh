version: "2"

linters:
  default: none
  enable:
  - errcheck
  - gci
  - goconst
  - gofmt
  - gosec
  - govet
  - ineffassign
  - lll
  - gosimple
  - staticcheck
  - misspell
  - nakedret
  - revive
  - unconvert
  - unused
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard library packages.
        - blank # Blank section: contains all blank imports.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(github.com/pulumi/) # Custom section: groups all imports with the github.com/pulumi/ prefix.
        - prefix(github.com/ovh/pulumi-ovh) # Custom section: local imports
      custom-order: true
exclusions:
  paths:
  - pkg/vendored
  - schema.go
  - pulumiManifest.go
run:
  timeout: 20m
